name: DOCS

on:
  push:
    branches: ["main"]
    paths:
      - '**.md'
      - 'py/mkdocsite.py'
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    paths:
      - '**.md'
      - 'py/mkdocsite.py'
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #- Fail early if someone added a file without documenting it.
      - name: Check documentation coverage
        run: python3 py/mkdocsite.py --check

      - name: Generate site sources
        run: python3 py/mkdocsite.py

      #- Pull requests only prove the site still compiles, so they never touch
      #- Pages. enablement creates the Pages site on the first main run,
      #- instead of failing until someone flips it in the settings.
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build -d ../_site

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    #- Only the main branch publishes. Pull requests stop after the build,
    #- which is enough to know the site still compiles.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
